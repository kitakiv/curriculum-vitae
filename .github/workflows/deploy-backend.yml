name: Deploy Backend
on:
  push: 
    branches: [main, developer-integration]
  workflow_dispatch:
# Permissions needed for this workflow
permissions:
  contents: write
# Define the jobs to be executed
jobs:
  # Build job
  Build:
    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest
    # Steps to be executed in the Build job
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3 
      # Login to DockerHub using secrets for credentials
      - name: Login to DockerHub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
      # Build Docker image with a specific tag
      - name: Build Docker Image
        run: docker build -t kitakiv/cv-backend:latest .
      # Push the built image to DockerHub
      - name: Push to DockerHub
        run: docker push kitakiv/cv-backend:latest 
  # Deploy job
  Deploy:
    # Use a self-hosted runner for deployment
    runs-on: self-hosted
    # Steps to be executed in the Deploy job
    steps:
      # Pull the latest Docker image from DockerHub
       - name: Stop Docker Compose container
         run: cd app && sudo docker compose -f docker-compose.prod.yml stop backend

       - name: Pull the latest Docker image
         run: cd app && sudo docker compose -f docker-compose.prod.yml pull backend

       - name: Run the updated container
         run: cd app && sudo docker compose -f docker-compose.prod.yml up -d --no-deps backend

       - name: Check container status
         run: cd app && sudo docker compose -f docker-compose.prod.yml ps