services:
  mysql:
    image: mysql
    env_file:
      - .env
    ports:
      - 3306:3306
  redis:
    container_name: cache
    image: redis
    env_file:
      - .env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis:/data
volumes:
  redis:
    driver: local